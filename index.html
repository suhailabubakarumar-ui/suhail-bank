<style>
:root { --bg-color: #eef4f9; --text-color: #17202a; --card-bg: #ffffff; --border-color: #d3dae1; --primary-color: #0968b4; --panel-bg: #ffffff; }
body.dark-mode { --bg-color: #12181f; --text-color: #e0e6ed; --card-bg: #1e2732; --border-color: #334155; --panel-bg: #1e2732; }
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg-color);color:var(--text-color);transition:background 0.3s, color 0.3s}
.hidden{display:none!important}
.page{min-height:100vh;padding:24px 14px;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:470px;background:var(--card-bg);border-radius:24px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.10)}
.brand{text-align:center;color:var(--primary-color);font-size:36px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;justify-content:center;gap:10px}
.brand img{width:42px;height:42px}
.subtitle{text-align:center;color:#737b84;font-size:17px;margin:0 0 20px}
label{display:block;font-weight:700;margin:15px 0 7px}
input, select, textarea{width:100%;padding:14px;border:1px solid var(--border-color);border-radius:13px;font-size:16px;outline:none;background:var(--card-bg);color:var(--text-color)}
button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:16px;background:var(--primary-color);color:white;font-size:16px;font-weight:700;cursor:pointer}
button.secondary{background:#e9f1f8;color:var(--primary-color)}
body.dark-mode button.secondary{background:#2a3646;color:#38bdf8}
.theme-toggle{background:transparent;border:1px solid var(--border-color);color:var(--text-color);width:auto;padding:8px 12px;margin:0;font-size:14px;border-radius:10px}
.link{color:var(--primary-color);text-align:center;font-weight:700;margin-top:18px;cursor:pointer}
.msg{padding:13px 15px;border-radius:12px;margin:15px 0;font-weight:600;display:none}
.msg.error{display:block;background:#fde8ea;color:#a51f35}
.msg.success{display:block;background:#e7f7ec;color:#19713a}
.topbar{width:100%;max-width:900px;margin:0 auto 15px;display:flex;justify-content:space-between;align-items:center}
.topbar h2{margin:0;color:var(--primary-color);display:flex;align-items:center;gap:8px}
.topbar h2 img{width:32px;height:32px}
.logout{width:auto;margin:0;padding:8px 14px}
.dashboard{width:100%;max-width:900px;margin:auto}
.balance{background:var(--primary-color);color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}
.balance h1{font-size:38px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.service{background:var(--panel-bg);border:1px solid var(--border-color);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.06);cursor:pointer;color:var(--text-color);text-align:center}
.service b{display:block;margin-top:8px;font-size:15px}
.service span{font-size:28px}
.panel{background:var(--panel-bg);border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 5px 18px rgba(0,0,0,.06);border:1px solid var(--border-color)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalbox{background:var(--card-bg);color:var(--text-color);width:100%;max-width:430px;border-radius:22px;padding:24px;max-height:92vh;overflow:auto}
.password-wrap{position:relative;display:block}.password-wrap input{padding-right:44px!important}.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:5px;font-size:18px;color:var(--text-color)}
.toast-container{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 36px));pointer-events:none}
.toast{padding:14px 16px;border-radius:14px;background:var(--card-bg);color:var(--text-color);box-shadow:0 8px 28px rgba(0,0,0,.16);font-weight:700;border-left:5px solid var(--primary-color)}
.receipt-box{background:#fff;color:#000;padding:20px;border-radius:12px;border:1px dashed #ccc;text-align:left;font-family:sans-serif}
.receipt-box h2{color:#0968b4;margin:0 0 5px;text-align:center}
.receipt-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
</style>
</head>

</div>

<div id="contentPanel" class="panel">

<h3>Transaction History</h3>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
<div class="modalbox"><div id="modalContent"></div></div>
</div>

<script>
var SUPABASE_URL = "https://pqtoiotxgswilizibslo.supabase.co";
var SUPABASE_KEY = "sb_publishable_Pv55p1zoIfJEHZ8CzC3aFQ_HAAkuicj";
var QUICKTELLER_CLIENT_ID = "IKIA3FB123303C9F3F2D591C97D5429AC7C1531491EE";
var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var currentUser = null, currentProfile = null, currentAccount = null;

function $(id) { return document.getElementById(id); }
function showRegister() { clearMsg(); $("registerForm").classList.remove("hidden"); $("loginForm").classList.add("hidden"); }
function showLogin() { clearMsg(); $("loginForm").classList.remove("hidden"); $("registerForm").classList.add("hidden"); }
function setMsg(text, type) { var el = $("authMsg"); el.className = "msg " + (type||"error"); el.textContent = text; }
function clearMsg() { var el = $("authMsg"); el.className = "msg"; el.textContent = ""; }
function money(n) { return "₦" + Number(n||0).toLocaleString('en-NG', {minimumFractionDigits:2}); }
function closeModal() { $("modal").classList.add("hidden"); }
function openModal(html) { $("modalContent").innerHTML = html; $("modal").classList.remove("hidden"); }

function notify(text, type) {
  var box = $("toastContainer");
  var toast = document.createElement("div");
  toast.className = "toast " + (type||"info");
  toast.textContent = text;
  box.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
}
if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark-mode");

function togglePassword(button) {
  var input = button.closest('.password-wrap').querySelector('input');
  input.type = input.type === 'password' ? 'text' : 'password';
  button.textContent = input.type === 'password' ? '👁️' : '🙈';
}

async function logTransaction(type, amount) {
  if(!currentAccount) return;
  try {
    await supabaseClient.from("transactions").insert({
      account_id: currentAccount.id,
      transaction_type: type,
      amount: amount
    });
  } catch(e) { console.log(e); }
}

async function loadUserData() {
  var pRes = await supabaseClient.from("users").select("*").eq("id", currentUser.id).maybeSingle();
  currentProfile = pRes.data;
  var aRes = await supabaseClient.from("accounts").select("*").eq("user_id", currentUser.id).maybeSingle();
  currentAccount = aRes.data;
}

async function startApp() {
  await loadUserData();
  $("authPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");
  
  if (currentUser.email.includes("admin") || currentUser.email === "suhailabubakarumar@gmail.com") {
    $("adminServiceBtn").classList.remove("hidden");
  } else {
    $("adminServiceBtn").classList.add("hidden");
  }

  if(currentAccount) {
    $("accountNumber").textContent = currentAccount.account_number;
    $("balance").textContent = money(currentAccount.balance);
    loadHistory();
  }
}

async function checkSession() {
  var res = await supabaseClient.auth.getSession();
  if (res.data && res.data.session) {
    currentUser = res.data.session.user;
    try { await startApp(); } catch(e) { showLogin(); }
  } else { showLogin(); }
}

$("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault(); clearMsg();
  try {
    var email = $("regEmail").value.trim(), pass = $("regPassword").value;
    var res = await supabaseClient.auth.signUp({ email: email, password: pass });
    if(res.error) throw res.error;
    currentUser = res.data.user;
    await supabaseClient.from("users").insert({ id: currentUser.id, full_name: $("regName").value.trim(), phone: $("regPhone").value.trim(), transaction_pin: $("regPin").value });
    var accNo = "30" + Math.floor(10000000 + Math.random() * 90000000);
    await supabaseClient.from("accounts").insert({ user_id: currentUser.id, account_number: accNo, balance: 0 });
    await startApp();
  } catch(err) { setMsg(err.message); }
});

$("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault(); clearMsg();
  try {
    var res = await supabaseClient.auth.signInWithPassword({ email: $("loginEmail").value.trim(), password: $("loginPassword").value });
    if (res.error) throw res.error;
    currentUser = res.data.user;
    await startApp();
  } catch(err) { setMsg(err.message); }
});

// PDF RECEIPT GENERATOR
function showReceiptModal(title, details) {
  var refNo = "REF-" + Math.floor(10000000 + Math.random() * 90000000);
  var html = `
    <div id="receiptToPrint" class="receipt-box">
      <h2>Suhail Bank</h2>
      <p style="text-align:center;font-size:12px;color:#666;margin-bottom:15px">Official Transaction Receipt</p>
      <div class="receipt-row"><span>Type:</span> <b>${title}</b></div>
      <div class="receipt-row"><span>Amount:</span> <b>${money(details.amount)}</b></div>
      <div class="receipt-row"><span>Sender:</span> <b>${currentProfile?currentProfile.full_name:'User'}</b></div>
      <div class="receipt-row"><span>Account No:</span> <b>${currentAccount.account_number}</b></div>
      <div class="receipt-row"><span>Destination:</span> <b>${details.dest || 'N/A'}</b></div>
      <div class="receipt-row"><span>Reference:</span> <b>${refNo}</b></div>
      <div class="receipt-row"><span>Date:</span> <b>${new Date().toLocaleString()}</b></div>
      <div class="receipt-row"><span>Status:</span> <b style="color:green">SUCCESSFUL ✅</b></div>
    </div>
    <button onclick="downloadPDFReceipt('${refNo}')">🖨️ Download / Print Receipt</button>
    <button class="secondary" onclick="closeModal()">Close</button>
  `;
  openModal(html);
}

function downloadPDFReceipt(refNo) {
  var element = document.getElementById('receiptToPrint');
  var opt = {
    margin:       0.5,
    filename:     'SuhailBank_Receipt_' + refNo + '.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
}

// QUICKTELLER DEPOSIT
function openDeposit() {
  openModal('<h3>💳 Quickteller Deposit</h3><label>Amount (₦)</label><input id="depAmt" type="number" min="100" placeholder="1000"><button onclick="payQuickteller()">Proceed to Pay</button><button class="secondary" onclick="closeModal()">Cancel</button>');
}

function payQuickteller() {
  var amt = Number($("depAmt").value);
  if (!amt || amt < 100) { notify("Enter minimum ₦100", "error"); return; }
  closeModal();
  if (window.webpayCheckout) {
    window.webpayCheckout({
      merchantCode: QUICKTELLER_CLIENT_ID, payItemExKey: "10101", txn_ref: "SB_" + Date.now(),
      amount: amt * 100, currency: "566", cust_email: currentUser.email,
      onComplete: async function(r) {
        if (r && (r.resp === "00" || r.desc === "Approved")) {
          await supabaseClient.rpc("deposit_money", { p_amount: amt });
          await logTransaction("Deposit", amt);
          await startApp();
          showReceiptModal("Deposit Successful", { amount: amt, dest: "Suhail Bank Account" });
        }
      }
    });
  } else {
    supabaseClient.rpc("deposit_money", { p_amount: amt }).then(async () => { 
      await logTransaction("Deposit", amt);
      await startApp(); 
      showReceiptModal("Deposit Successful", { amount: amt, dest: "Suhail Bank Account" });
    });
  }
}

// TRANSFER WITH BANK SELECTOR
function openTransfer() {
  var bankOptions = `
    <option value="Suhail Bank">Suhail Bank (Internal Transfer)</option>
    <option value="OPay">OPay Digital Services</option>
    <option value="Moniepoint">Moniepoint Microfinance Bank</option>
    <option value="Palmpay">Palmpay</option>
    <option value="Kuda Bank">Kuda Microfinance Bank</option>
    <option value="GTBank">Guaranty Trust Bank (GTB)</option>
    <option value="First Bank">First Bank of Nigeria</option>
    <option value="Zenith Bank">Zenith Bank</option>
    <option value="UBA">United Bank for Africa (UBA)</option>
    <option value="Access Bank">Access Bank</option>
  `;
  openModal('<h3>🔄 Transfer Money</h3><label>Select Destination Bank</label><select id="trBank">' + bankOptions + '</select><label>Account Number</label><input id="trAcc" maxlength="10" placeholder="10-digit Account No"><label>Amount (₦)</label><input id="trAmt" type="number" placeholder="500"><label>4-Digit PIN</label><div class="password-wrap"><input id="trPin" type="password" maxlength="4"><button type="button" class="password-toggle" onclick="togglePassword(this)">👁️</button></div><button onclick="doTransfer()">Transfer Funds</button><button class="secondary" onclick="closeModal()">Cancel</button>');
}

async function doTransfer() {
  var bank = $("trBank").value, acc = $("trAcc").value, amt = Number($("trAmt").value), pin = $("trPin").value;
  if (!acc || acc.length < 10) { notify("Enter a valid 10-digit Account Number", "error"); return; }
  
  if (bank === "Suhail Bank") {
    var res = await supabaseClient.rpc("transfer_money", { p_receiver_account_number: acc, p_amount: amt, p_pin: pin });
    if (res.error) notify(res.error.message, "error");
    else { 
      closeModal(); 
      await logTransaction("Transfer Sent to " + acc, -amt);
      await startApp(); 
      showReceiptModal("Transfer Successful", { amount: amt, dest: bank + " (" + acc + ")" });
    }
  } else {
    var res = await supabaseClient.rpc("withdraw_money", { p_amount: amt, p_pin: pin });
    if (res.error) notify(res.error.message, "error");
    else { 
      closeModal(); 
      await logTransaction("Transfer to " + bank, -amt);
      await startApp(); 
      showReceiptModal("Interbank Transfer Successful", { amount: amt, dest: bank + " (" + acc + ")" });
    }
  }
}

function openSavings() {

async function doSave() {
  var amt = Number($("sAmt").value), pin = $("sPin").value;
  var res = await supabaseClient.rpc("withdraw_money", { p_amount: amt, p_pin: pin });
  if(res.error) notify(res.error.message, "error");
  else { 
    closeModal(); 
    await logTransaction("Savings Lock", -amt);
    await startApp(); notify("Funds Saved Successfully!", "success"); 
  }
}

async function loadHistory() {
  if (!currentAccount) return;
  var box = $("historyList"); box.innerHTML = '<div style="text-align:center;color:#777;padding:15px">Loading...</div>';
  try {
    var res = await supabaseClient.from("transactions").select("*").eq("account_id", currentAccount.id).order("created_at", { ascending: false });
    var rows = res.data || [];
    if (!rows.length) { box.innerHTML = '<div style="text-align:center;color:#777;padding:15px">No transactions recorded yet.</div>'; return; }
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var t = rows[i];
      var isNeg = Number(t.amount) < 0;
      html += '<div style="padding:10px 0;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center"><div><b>' + t.transaction_type + '</b><br><small style="color:#777">' + new Date(t.created_at).toLocaleString() + '</small></div><strong style="color:' + (isNeg?'#c62828':'#19713a') + '">' + money(t.amount) + '</strong></div>';
    }
    box.innerHTML = html;
  } catch (e) { box.innerHTML = '<div style="text-align:center;color:#777;padding:15px">Could not load history.</div>'; }
}

function logout() { supabaseClient.auth.signOut(); location.reload(); }
