<!DOCTYPE html>
<html lang="en">

<script>
const manifestObj = {
  "name": "Suhail Bank",
  "short_name": "Suhail Bank",
  "start_url": "./index.html",
  "display": "standalone",
  "background_color": "#eef4f9",
  "theme_color": "#0b67b2",
  "description": "Suhail Bank Digital Banking Mobile App",
  "icons": [
    {
      "src": "https://cdn-icons-png.flaticon.com/512/2830/2830284.png",
      "sizes": "192x192",
      "type": "image/png",
      "purpose": "any maskable"
    },
    {
      "src": "https://cdn-icons-png.flaticon.com/512/2830/2830284.png",
      "sizes": "512x512",
      "type": "image/png",
      "purpose": "any maskable"
    }
  ]
};
const stringManifest = JSON.stringify(manifestObj);
const blob = new Blob([stringManifest], {type: 'application/json'});
const manifestURL = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestURL;
document.head.appendChild(link);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://newwebpay.interswitchng.com/inline-checkout.js"></script>
<style>
:root {
  --bg-color: #eef4f9;
  --text-color: #17202a;
  --card-bg: #ffffff;
  --border-color: #d3dae1;
  --primary-color: #0968b4;
  --panel-bg: #ffffff;
}
body.dark-mode {
  --bg-color: #12181f;
  --text-color: #e0e6ed;
  --card-bg: #1e2732;
  --border-color: #334155;
  --panel-bg: #1e2732;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg-color);color:var(--text-color);transition:background 0.3s, color 0.3s}
.hidden{display:none!important}
.page{min-height:100vh;padding:24px 14px;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:470px;background:var(--card-bg);border-radius:24px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.10)}
.brand{text-align:center;color:var(--primary-color);font-size:38px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;justify-content:center;gap:10px;}
.brand img{width:42px;height:42px;}
.subtitle{text-align:center;color:#737b84;font-size:18px;margin:0 0 24px}
label{display:block;font-weight:700;margin:15px 0 7px}
input, select{width:100%;padding:15px;border:1px solid var(--border-color);border-radius:13px;font-size:16px;outline:none;background:var(--card-bg);color:var(--text-color)}
input:focus,textarea:focus,select:focus{border-color:var(--primary-color)}
textarea{width:100%;min-height:130px;padding:15px;border:1px solid var(--border-color);border-radius:13px;font-size:16px;outline:none;resize:vertical;background:var(--card-bg);color:var(--text-color)}
button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:16px;background:var(--primary-color);color:white;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
button.secondary{background:#e9f1f8;color:var(--primary-color)}
body.dark-mode button.secondary{background:#2a3646;color:#38bdf8}
button.danger{background:#c62828}
.theme-toggle{background:transparent;border:1px solid var(--border-color);color:var(--text-color);width:auto;padding:8px 12px;margin:0;font-size:14px;border-radius:10px}
.link{color:var(--primary-color);text-align:center;font-weight:700;margin-top:18px;cursor:pointer}
.msg{padding:13px 15px;border-radius:12px;margin:15px 0;font-weight:600;display:none}
.msg.error{display:block;background:#fde8ea;color:#a51f35}
.msg.success{display:block;background:#e7f7ec;color:#19713a}
.msg.info{display:block;background:#e8f2fb;color:#155b8c}
.topbar{width:100%;max-width:900px;margin:0 auto 15px;display:flex;justify-content:space-between;align-items:center}
.topbar h2{margin:0;color:var(--primary-color);display:flex;align-items:center;gap:8px;}
.topbar h2 img{width:32px;height:32px;}
.logout{width:auto;margin:0;padding:10px 15px}
.dashboard{width:100%;max-width:900px;margin:auto}
.balance{background:var(--primary-color);color:#fff;border-radius:22px;padding:25px;margin-bottom:18px}
.balance small{opacity:.9}
.balance h1{font-size:38px;margin:8px 0}
.account{font-size:14px;opacity:.95}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.service{background:var(--panel-bg);border:1px solid var(--border-color);border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(0,0,0,.07);cursor:pointer;color:var(--text-color)}
.service b{display:block;margin-top:8px}
.service span{font-size:28px}
.panel{background:var(--panel-bg);border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 5px 18px rgba(0,0,0,.07);border:1px solid var(--border-color)}
.panel h3{margin-top:0}
.profile-row{padding:9px 0;border-bottom:1px solid var(--border-color)}
.profile-row:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalbox{background:var(--card-bg);color:var(--text-color);width:100%;max-width:430px;border-radius:22px;padding:24px;max-height:92vh;overflow:auto}
.receipt{text-align:center}
.receipt .logo{font-size:30px;font-weight:800;color:var(--primary-color)}
.receipt-line{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--border-color);text-align:left}
.status{display:inline-block;margin:14px 0;padding:7px 14px;border-radius:99px;background:#e7f7ec;color:#19713a;font-weight:700}
.empty{text-align:center;color:#777;padding:15px}
.password-wrap{position:relative;display:block}.password-wrap input{padding-right:44px!important}.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:5px;font-size:18px;line-height:1;opacity:.7;color:var(--text-color)}.password-toggle:hover{opacity:1}
.toast-container{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 36px));pointer-events:none}
.toast{padding:14px 16px;border-radius:14px;background:var(--card-bg);color:var(--text-color);box-shadow:0 8px 28px rgba(0,0,0,.16);font-weight:700;border-left:5px solid var(--primary-color);animation:toastIn .25s ease}
.toast.success{border-left-color:#1b8a4b}.toast.error{border-left-color:#c62828}.toast.info{border-left-color:var(--primary-color)}.toast.hide{opacity:0;transform:translateY(-8px);transition:.25s}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="toastContainer" class="toast-container"></div>

<section id="authPage" class="page">
<div class="card">
<h1 class="brand"><img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" alt="Logo"> Suhail Bank</h1>
<p id="authSubtitle" class="subtitle">Login to Demo Account</p>
<div id="authMsg" class="msg"></div>
<p style="text-align:center;color:#777;font-size:12px;margin:0 0 10px">Learning project — not a real bank.</p>

<form id="loginForm">
<label>Email</label>
<input id="loginEmail" type="email" required autocomplete="email">

<label>Password</label>
<div class="password-wrap"><input id="loginPassword" type="password" required autocomplete="current-password"><button type="button" class="password-toggle" onclick="togglePassword(this)">👁️</button></div>

<button type="submit">Login</button>
</form>
</div>
</section>

<section id="appPage" class="page hidden">
<div class="dashboard">
<div class="topbar">
<h2><img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" alt="Logo"> Suhail Bank</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="balance">
<small>Available Demo Balance</small>
<h1 id="balance">₦0.00</h1>
<div class="account">Account No: <b id="accountNumber">—</b></div>
</div>

<div class="grid">
<button class="service" onclick="openDeposit()"><span>💳</span><b>Quickteller Deposit</b></button>
<button class="service" onclick="openTransfer()"><span>🔄</span><b>Transfer</b></button>
</div>
</div>
</section>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
<div class="modalbox"><div id="modalContent"></div></div>
</div>

<script>
var SUPABASE_URL = "https://pqtoiotxgswilizibslo.supabase.co";
var SUPABASE_KEY = "sb_publishable_Pv55p1zoIfJEHZ8CzC3aFQ_HAAkuicj";
var QUICKTELLER_CLIENT_ID = "IKIA3FB123303C9F3F2D591C97D5429AC7C1531491EE";
var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function $(id) { return document.getElementById(id); }
function closeModal() { $("modal").classList.add("hidden"); }
function openModal(html) { $("modalContent").innerHTML = html; $("modal").classList.remove("hidden"); }

async function checkSession() {
  var res = await supabaseClient.auth.getSession();
  if (res.data && res.data.session) {
    $("authPage").classList.add("hidden");
    $("appPage").classList.remove("hidden");
  }
}
function logout() { supabaseClient.auth.signOut(); location.reload(); }
checkSession();
</script>
</body>
</html>
